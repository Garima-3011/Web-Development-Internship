<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · SkillSprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <span class="brand-text">SkillSprint</span>
      </div>

      <h1 class="auth-headline">Mentor dashboard</h1>
      <p class="auth-sub">Sign in to track students, courses, and placements.</p>

      <div class="auth-demo" role="note">
        <strong>Demo credentials</strong><br />
        Email: <code>admin@skillsprint.edu</code><br />
        Password: <code>admin123</code>
      </div>

      <div id="loginAlert" class="alert alert-error hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="username" placeholder="you@skillsprint.edu" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter password" required />
        </div>
        <div class="form-group">
          <label class="checkbox-row">
            <input type="checkbox" id="remember" name="remember" />
            Remember my email on this device
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="auth-footer">Frontend-only session · SkillSprint major project</p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      redirectIfAuthenticated();
      const emailInput = document.getElementById("email");
      const remembered = getRememberedEmail();
      if (remembered) {
        emailInput.value = remembered;
        document.getElementById("remember").checked = true;
      }
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = emailInput.value;
        const password = document.getElementById("password").value;
        const remember = document.getElementById("remember").checked;
        const alertEl = document.getElementById("loginAlert");
        if (!email.trim() || !password) {
          alertEl.textContent = "Please enter both email and password.";
          alertEl.classList.remove("hidden");
          return;
        }
        const result = login(email, password, remember);
        if (!result.ok) {
          alertEl.textContent = result.error;
          alertEl.classList.remove("hidden");
          return;
        }
        window.location.href = "dashboard.html";
      });
    });
  </script>
</body>
</html>
