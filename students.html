<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students · SkillSprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <span class="brand-text">SkillSprint</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-label">Menu</div>
        <a class="nav-link" href="dashboard.html" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
          Overview
        </a>
        <a class="nav-link" href="analytics.html" data-page="analytics">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M10 19V9M16 19v-6M22 19V7"/></svg>
          Analytics
        </a>
        <a class="nav-link" href="students.html" data-page="students">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Students
        </a>
        <div class="nav-label">Account</div>
        <a class="nav-link" href="settings.html" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="logoutBtn" type="button">Sign out</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title">Students</h1>
        </div>
        <div class="topbar-right">
          <div class="user-chip">
            <div class="user-avatar" id="userAvatar">A</div>
            <div class="user-meta">
              <strong id="userName">User</strong>
              <span id="userEmail">email</span>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <h1 class="font-display">Students</h1>
          <p>Search and filter learners across SkillSprint tracks.</p>
        </div>

        <div class="toolbar">
          <label class="sr-only" for="studentSearch">Search students</label>
          <input class="form-input search-input" type="search" id="studentSearch" placeholder="Search name, email, track…" />
          <label class="sr-only" for="statusFilter">Status</label>
          <select class="form-select" id="statusFilter">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="trial">Trial</option>
            <option value="paused">Paused</option>
            <option value="placed">Placed</option>
            <option value="churned">Churned</option>
          </select>
        </div>

        <section class="card">
          <div id="studentsEmpty" class="empty-state hidden">
            <h3>No students match</h3>
            <p>Try a different search or status filter.</p>
          </div>
          <div class="table-wrap" id="studentsTableWrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th data-sort="id">ID <span class="sort-indicator"></span></th>
                  <th data-sort="name">Name <span class="sort-indicator"></span></th>
                  <th data-sort="email">Email <span class="sort-indicator"></span></th>
                  <th data-sort="plan">Track <span class="sort-indicator"></span></th>
                  <th data-sort="status">Status <span class="sort-indicator"></span></th>
                  <th data-sort="mrr">Sprint day <span class="sort-indicator"></span></th>
                  <th data-sort="joined">Joined <span class="sort-indicator"></span></th>
                </tr>
              </thead>
              <tbody id="studentsBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <span class="pagination-info" id="pageInfo">Loading…</span>
            <div class="pagination-actions">
              <button class="btn btn-secondary btn-sm" type="button" id="prevPage">Previous</button>
              <button class="btn btn-secondary btn-sm" type="button" id="nextPage">Next</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
